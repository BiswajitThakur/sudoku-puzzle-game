[package]
name = "sudoku-puzzle-game"
version = "0.1.0"
edition = "2024"
authors = ["Biswajit Thakur"]
description = "A Sudoku puzzle generator"
license-file = "LICENSE"
repository = "https://github.com/BiswajitThakur/sudoku-puzzle-game"
readme = "README.md"
keywords = ["sudoku", "puzzle", "wasm", "game"]
categories = ["games", "wasm"]

[lib]
crate-type = ["cdylib"]

[dependencies]
base64 = "0.22.1"
wasm-bindgen = "0.2"
rand = "0.10"

[target.wasm32-unknown-unknown.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
