<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sudoku - Puzzle Game</title>
  <link href="style.css" rel="stylesheet" />
</head>

<body>
  <div class="container">
    <h2>Sudoku - Puzzle Game</h2>

    <div id="game_cnt" class="game-container"></div>

    <div class="options">
      <div class="game-btns" id="d_lvl"></div>

      <div class="game-btns" id="ctrls">
        <button id="undo">Undo</button>
        <button id="redo">Redo</button>
        <button id="solve">Solve</button>
        <button id="reset">Reset</button>
        <button id="share">Share</button>
        <button id="varify">Verify</button>
      </div>

      <div class="game-btns">
        <input id="create_new_inp" type="number" placeholder="Enter size" />

        <select id="game_lvl">
          <option value="easy">Easy</option>
          <option value="medium">Medium</option>
          <option value="difficult">Difficult</option>
        </select>

        <button id="create_new">Create</button>
      </div>

      <a href="https://github.com/BiswajitThakur/sudoku-puzzle-game.git">
        Source Code
      </a>
    </div>
  </div>

  <script type="module" src="script.js"></script>

</body>

</html>
